name: dansho_store
description: "A new Flutter project."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  animate_do: ^5.1.0
  connectivity_plus: ^7.3.1
  cupertino_icons: ^1.0.8
  dio: ^5.11.1
  firebase_core: ^3.12.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_dotenv: ^6.0.1
  flutter_localizations:
    sdk: flutter
  flutter_native_splash: ^2.4.8
  flutter_screenutil: ^5.9.3
  freezed_annotation: ^3.1.0
  get_it: ^9.2.1
  pretty_dio_logger: ^1.4.0
  retrofit: ^4.10.0
  shared_preferences: ^2.5.5
dev_dependencies:
  build_runner: ^2.16.1
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  freezed: ^4.0.2
  json_serializable: ^6.14.1
  retrofit_generator: ^10.2.11
  very_good_analysis: ^11.0.0

flutter:
  uses-material-design: true

  assets:
    - .env.dev
    - .env.prod
    - assets/icons/
    - assets/images/core/
    - assets/images/admin/
    - assets/images/customer/
    - assets/svg/
  fonts:
    #Arabic
    - family: Cairo
      fonts:
        - asset: assets/fonts/arabic/cairo/Cairo-Bold.ttf
          weight: 700
        - asset: assets/fonts/arabic/cairo/Cairo-Medium.ttf
          weight: 500
        - asset: assets/fonts/arabic/cairo/Cairo-Regular.ttf
          weight: 400
    #English
    - family: Poppins
      fonts:
        - asset: assets/fonts/english/poppins/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/english/poppins/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/english/poppins/Poppins-Regular.ttf
          weight: 400
  #assets geneator
flutter_assets:
  assets_path:
    - assets/images/core/
    - assets/images/admin/
    - assets/images/customer/
    - assets/svg/
    - assets/icons/
  output_path: lib/core/styles/images/
  filename: assets_manager.dart
  field_prefix:

    #flutter app icon
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon.jpg"
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/icons/play_store_512.png"

flutter_intl:
  enabled: true
